name: Extract project archive

on:
  push:
    paths:
      - 'ProjectCore_Development_V0.1.7.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project archive
        shell: bash
        run: |
          set -euo pipefail
          archive="ProjectCore_Development_V0.1.7.zip"
          test -f "$archive"
          rm -rf .project-extract
          mkdir .project-extract
          unzip -q "$archive" -d .project-extract
          shopt -s dotglob nullglob
          entries=(.project-extract/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            cp -a "${entries[0]}"/. .
          else
            cp -a .project-extract/. .
          fi
          rm -rf .project-extract "$archive" .github/workflows/extract-project.yml

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit"
          else
            git commit -m "Extract project files into repository root"
            git push
          fi
